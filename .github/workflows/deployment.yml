name: Portable demo deployment
on:
  push:
    paths: ['Dockerfile', '.dockerignore', 'deploy/**', 'scripts/serve-web.mjs', '.github/workflows/deployment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEED_ADMIN_PASSWORD: CI-Fixture-Password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node deploy/configure.mjs
      - run: docker compose --env-file deploy/.env -f deploy/compose.yml up -d --build --wait --wait-timeout 900
      - name: Check UI, roles and restart persistence
        run: |
          node deploy/verify.mjs
          docker compose --env-file deploy/.env -f deploy/compose.yml restart app
          docker compose --env-file deploy/.env -f deploy/compose.yml up -d --wait --wait-timeout 120
          node deploy/verify.mjs
      - if: failure()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml logs --tail=100
      - if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml down
