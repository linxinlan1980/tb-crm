<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伴圆 CRM · 设计评审</title><style>
:root{--blue:#2563eb;--blue-hover:#1d4ed8;--blue-light:#eff6ff;--bg:#f3f5f8;--surface:#fff;--text:#1f2937;--muted:#64748b;--border:#d8e0ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--border);border-radius:6px;padding:7px 13px;color:var(--text)}button:hover{border-color:var(--blue);color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:var(--blue-hover)}button:disabled{opacity:.5;cursor:not-allowed}header{height:65px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:2}.brand{font-weight:750;color:var(--blue);font-size:19px}.search{flex:1;max-width:560px;background:var(--bg);border:1px solid var(--border);padding:8px 12px;border-radius:6px}select,input,textarea{border:1px solid var(--border);border-radius:6px;padding:8px;background:white;color:var(--text)}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 65px)}nav{padding:24px 12px;background:white;border-right:1px solid var(--border)}nav small{display:block;color:var(--muted);padding:0 12px;margin-bottom:12px}nav button{display:block;width:100%;text-align:left;border:0;margin:4px 0;padding:11px 14px}nav button.active{background:var(--blue-light);color:var(--blue);font-weight:650}.nav-end{margin-top:40px;color:var(--muted);padding:12px}main{padding:24px 32px;max-width:1680px;width:100%;margin:auto}.banner{font-size:12px;color:#475569;background:#e8edf4;padding:8px 14px;border-radius:5px;margin-bottom:20px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:25px;margin:0 0 3px}h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:0 0 5px}p{margin:5px 0 14px}.muted,small{color:var(--muted)}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:white;border:1px solid var(--border);border-radius:8px;padding:20px}.stat-value{font-size:28px;font-weight:650;letter-spacing:-1px;margin-top:10px}.cols{grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr)}.three{grid-template-columns:240px minmax(0,1fr) 280px}.row{padding:15px 0;border-top:1px solid #e9edf3}.row:first-of-type{border-top:0}.row-flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--blue-light);color:var(--blue);font-size:12px;margin-right:6px}.tag.gray{color:#475569;background:#edf0f4}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin:0 0 20px;padding:0 0 10px}.tabs span:first-child{color:var(--blue);font-weight:650}.path{display:flex;margin:18px 0;gap:4px;flex-wrap:wrap}.path span{padding:9px 15px;background:#e7ebf1;border-radius:4px;color:#64748b}.path span.current{background:var(--blue);color:white}.timeline{border-left:2px solid #dbeafe;margin-left:6px;padding-left:20px}.timeline .row{position:relative}.timeline .row:before{content:'';width:8px;height:8px;border-radius:50%;background:#2563eb;position:absolute;left:-25px;top:24px}.bar{height:8px;background:#e8eef8;border-radius:5px;overflow:hidden}.bar i{display:block;background:var(--blue);height:100%}table{border-collapse:collapse;width:100%;background:white;white-space:nowrap}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #e5eaf0}th{background:#f8fafc;color:#64748b;font-weight:500}.table-wrap{overflow:auto}.filters{margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.link{color:var(--blue);cursor:pointer}.progress-note{padding:12px;background:var(--blue-light);border-radius:6px;margin-top:14px}.modal-wrap{position:fixed;inset:0;background:#18223360;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;max-width:600px;width:100%;border-radius:10px;padding:26px;box-shadow:0 20px 80px #15234030}.modal label{display:block;margin:12px 0 6px}.modal input,.modal textarea{width:100%}.modal textarea{min-height:110px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:10px 22px;border-radius:7px;z-index:10}.empty{padding:24px;color:var(--muted);text-align:center}@media(max-width:1100px){.three{grid-template-columns:1fr 1.6fr}.three>.card:last-child{grid-column:1/-1}}@media(max-width:760px){header{padding:10px 14px;height:auto;flex-wrap:wrap;gap:8px}.search{order:3;min-width:100%}.layout{display:block}nav{display:flex;overflow:auto;padding:6px;border-bottom:1px solid var(--border)}nav small,.nav-end{display:none}nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}main{padding:16px}.cols,.three{grid-template-columns:1fr}.heading{align-items:flex-start;flex-wrap:wrap}.tabs{gap:12px;overflow:auto;white-space:nowrap}.card{padding:16px}}
</style><body><header><div class="brand">伴圆 CRM</div><input class="search" aria-label="搜索客户或商机" placeholder="搜索客户、商机、联系人…（设计示意）" onkeydown="if(event.key==='Enter')note('设计示意：正式版按权限跨对象搜索')"><button onclick="openForm()">＋ 快捷新建</button><select aria-label="评审角色" id="role" onchange="show('home')"><option value="sales">销售 · 示例用户</option><option value="manager">销售主管</option><option value="boss">老板</option><option value="admin">admin</option></select></header><div class="layout"><nav aria-label="主要页面"><small>销售与客户经营</small><button data-page="home" onclick="show('home')">工作台</button><button data-page="customer" onclick="show('customer')">客户 360</button><button data-page="opportunity" onclick="show('opportunity')">商机工作区</button><button data-page="pipeline" onclick="show('pipeline')">管道检查</button><button data-page="ai" onclick="show('ai')">AI 建议中心</button><div class="nav-end">设计候选 v1.0<br>蓝 · 白 · 灰<br>2026.11.15</div></nav><main><div class="banner">设计评审示意 · 全部为合成数据 · 不连接CRM、不发送消息、不写业务数据库；正式规则及完整范围见同目录设计文档。</div><div id="app"></div></main></div><div id="overlay"></div><div id="feedback" role="status" aria-live="polite"></div><script>
const state={page:'home',follow:false,approved:false,executed:false,stage:2,riskOnly:false};
const roleNames={sales:'我的销售工作台',manager:'团队销售工作台',boss:'经营驾驶舱',admin:'系统管理工作台'};
const roles=()=>document.getElementById('role').value;
const btn=(label,action,primary=false)=>`<button class="${primary?'primary':''}" onclick="${action}">${label}</button>`;
const stats=(items)=>`<div class="grid stats">${items.map(([label,value])=>`<div class="card"><small>${label}</small><div class="stat-value">${value}</div></div>`).join('')}</div>`;
function head(title,sub,actions=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${actions}</div></div>`}
function show(page){state.page=page;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));document.getElementById('app').innerHTML=views[page]();}
const views={
home(){const role=roles();if(role==='admin')return head(roleNames[role],'配置、人员、连接与运行状态')+stats([['启用用户','12'],['待检查连接','2'],['失败任务','1'],['当前版本','设计版']])+`<div class="card"><h2>需要处理</h2><div class="row">飞书尚未授权 ${btn('查看连接',"note('拟建：授权范围、最近同步与失败原因')")}</div><div class="row">演示备份恢复演练待执行 ${btn('查看计划',"note('拟建：恢复到隔离新库并核对')")}</div></div>`;
if(role==='boss')return head(roleNames[role],'本月经营 · 数字支持同口径钻取')+stats([['销售目标','¥200万'],['已赢单','¥80万'],['承诺预测','¥140万'],['目标缺口','¥60万']])+`<div class="card"><h2>本期经营变化</h2><p>示例商机B的预计成交日移至下月，需核对预测影响。</p>${btn('查看管道变化',"show('pipeline')",true)}<p class="muted">数字为合成样例，不代表本机企业实绩。预测汇总口径需在正式实现时统一。</p></div>`;
return head(roleNames[role],role==='manager'?'优先处理团队停滞商机和预测变化':'今天先完成这些工作，再查看经营全貌',btn('记录拜访',"openForm()",true))+stats([['今日行动',state.follow?'4':'3'],['逾期行动','1'],['待联系线索','2'],['本月开放商机','8']])+`<div class="grid cols"><section class="card"><h2>${role==='manager'?'团队需要关注':'优先事项'}</h2><div class="row row-flex"><div><span class="tag">明日会议</span><h3>示例制造 · 方案评审会</h3><small>依据：2026-11-16会议安排 · 关联商机：设备服务项目</small></div>${btn('会前准备',"show('customer')")}</div><div class="row row-flex"><div><span class="tag gray">缺少下一步</span><h3>设备服务项目 · 7天未更新行动</h3><small>依据：行动更新时间规则；正式阈值可配置</small></div>${btn('补充下一步',"show('opportunity')",true)}</div><div class="row"><span class="tag">AI待审</span>1条拜访纪要草稿 ${btn('查看建议',"show('ai')")}</div></section><aside class="card"><h2>本期目标</h2><small>目标 ¥100万 · 已赢单 ¥40万</small><div class="bar" style="margin:18px 0"><i style="width:40%"></i></div><p>目标进度 40%</p><p class="muted">预测与现金回款分别呈现；完成率不混入未赢单商机。</p>${btn('查看客户',"show('customer')")}</aside></div>`},
customer(){return head('示例制造有限公司','重点客户 · 负责人：示例销售 · 最近跟进：2026-11-15',btn('记录拜访',"openForm()",true)+btn('新建商机',"note('拟建：自动带入当前客户，保存后直接打开新商机')"))+`<div class="tabs"><span>经营概览</span><span>联系人</span><span>商机与合同</span><span>交付与服务</span><span>历史</span></div><div class="grid three"><aside class="card"><h2>客户资料</h2><small>行业</small><p>制造业（合成）</p><small>地区</small><p>上海</p><h2>关键联系人</h2><p>示例张经理 · 方案评估者</p><small>商机角色与职位分开管理</small><div class="row"><h3 class="link" onclick="show('opportunity')">设备服务项目 →</h3><p>¥100万 · 方案验证</p></div></aside><section class="card"><h2>活动时间线</h2><div class="timeline">${state.follow?'<div class="row"><span class="tag">刚刚保存·示意</span><h3>新增拜访记录</h3><p>关联本客户；下一步任务已在本页设计交互中安排。</p></div>':''}<div class="row"><small>2026-11-15 · 拜访记录</small><h3>客户希望补充试运行方案</h3><p>讨论实施边界；预算与签约日期仍待确认。</p>${btn('查看AI草稿',"show('ai')")}</div><div class="row"><small>2026-11-16 · 待办</small><h3>与评估者进行方案评审</h3><p>完成后确认下一步，关联当前客户和商机。</p>${btn('完成并安排下次',"openForm()")}</div></div></section><aside class="card"><h2>AI 客户简报</h2><span class="tag gray">设计样例</span><p>当前目标：完成方案验证。</p><p>待确认：客户预算、最终决策人、预计签约日期。</p><small>来源：本页合成拜访记录；正式版逐条可追溯。</small><div class="row">${btn('查看证据与建议',"show('ai')")}</div></aside></div>`},
opportunity(){const stages=['发现机会','需求确认','方案验证','报价','商务谈判','待签约'];return head('设备服务项目','客户：示例制造 · 金额 ¥100万 · 预计成交：2026-12-15',btn('记录沟通',"openForm()",true)+btn('创建报价',"note('拟建：带入商机、客户与产品，选择价目表和报价版本')"))+`<div class="path">${stages.map((s,i)=>`<span class="${i===state.stage?'current':''}">${s}</span>`).join('')}</div><div class="card" style="margin-bottom:18px"><div class="row-flex"><div><h2>当前阶段：${stages[state.stage]}</h2><p>需要确认：方案评审结果、客户关键人、下一步及日期。</p><small>指引帮助理解；强制条件在正式服务端统一校验。</small></div>${btn('核对并推进阶段',"openStage()",true)}</div></div><div class="grid cols"><section class="card"><h2>推进商机</h2><div class="tabs"><span>活动与下一步</span><span>联系人角色</span><span>报价与合同</span><span>变更历史</span></div><div class="row"><h3>下一步：方案评审</h3><p>负责人：示例销售 · 2026-11-16</p>${btn('更新行动',"openForm()")}</div><div class="row"><h3>变更历史</h3><p>预计成交日：2026-11-30 → 2026-12-15</p><small>合成样例 · 变更原因应随事件保留</small></div></section><aside class="card"><h2>风险与支持</h2><span class="tag gray">决策人待确认</span><p>目前仅与评估者建立联系，不能推断已有最终采购批准。</p>${btn('查看AI建议',"show('ai')")}<div class="row"><h3>预测类别</h3><p>Pipeline · 尚未承诺</p><small>预测类别与销售阶段分别管理。</small></div></aside></div>`},
pipeline(){return head('销售管道检查','本期 · 开放商机 · 统计与明细使用同一筛选',btn('保存视图',"note('拟建：保存期间、负责人、风险和列设置')"))+stats([['开放金额','¥260万'],['本周新增','¥80万'],['移至下期','¥100万'],['停滞机会','2']])+`<div class="filters"><select aria-label="管道期间"><option>本月</option><option>本季度</option></select><select aria-label="负责人范围"><option>我的团队</option><option>仅本人</option></select>${btn(state.riskOnly?'显示全部开放商机':'仅看风险',"state.riskOnly=!state.riskOnly;show('pipeline')",state.riskOnly)}<span class="muted">样例数据；不将输单计入开放金额</span></div><div class="card table-wrap"><table><thead><tr><th>商机</th><th>金额</th><th>预计成交日期</th><th>预测类别</th><th>最近变化</th><th>下一步</th></tr></thead><tbody><tr><td><button onclick="show('opportunity')">设备服务项目</button></td><td>¥100万</td><td>12-15</td><td>Pipeline</td><td><span class="tag">日期后移</span></td><td>方案评审</td></tr>${state.riskOnly?'':'<tr><td>示例维护服务</td><td>¥160万</td><td>11-30</td><td>Best Case</td><td>金额已更新</td><td>报价确认</td></tr>'}</tbody></table><div class="progress-note">正式实现需支持变动明细、历史快照及可追溯统计。样例仅展示界面布局，汇总卡不随筛选计算。</div></div>`},
ai(){return head('AI 建议中心','把记录变为可确认、可执行的下一步')+`<div class="grid cols"><section class="card"><h2>拜访后更新 · 示例制造</h2><span class="tag">${state.executed?'示意已执行':state.approved?'示意已批准':'待核对'}</span><div class="row"><small>来源 · 合成拜访记录 2026-11-15</small><p>“客户希望明天评审方案，预算还没有确认。”</p></div><div class="row"><h3>拟新增</h3><p>跟进摘要：客户提出补充试运行方案。</p><p>下一步：安排方案评审 · 2026-11-16 · 示例销售。</p><p>预算：保持未知，不填入推测金额。</p></div><div class="row"><h3>依据及确认项</h3><p>“明天”按样例发生时间2026-11-15解释；正式系统需核对用户时区和实际录入时间。</p></div><div class="actions">${btn('修改草稿',"openForm()")}<button class="primary" ${state.approved?'disabled':''} onclick="state.approved=true;show('ai');note('仅改变本设计页状态，尚未写入业务')">核对并批准</button><button ${!state.approved||state.executed?'disabled':''} onclick="state.executed=true;show('ai');note('示意执行回执；未连接CRM')">执行已批准建议</button>${btn('拒绝/重置',"state.approved=false;state.executed=false;show('ai')")}</div></section><aside class="card"><h2>执行边界</h2><p>正式版：权限、版本、过期、幂等和审批均在业务服务检查。</p><p>批准与实际写入分开，失败保留原因；不得把模型回答当执行成功。</p><small>当前页面没有模型调用、委托凭证或真实写操作。</small></aside></div>`}
};
function note(text){document.getElementById('feedback').innerHTML='';const el=document.createElement('div');el.className='toast';el.textContent=text;document.getElementById('feedback').appendChild(el);setTimeout(()=>el.remove(),3500)}
let lastFocus;
function closeModal(){document.getElementById('overlay').innerHTML='';if(lastFocus)lastFocus.focus()}
function modal(content){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${content}</section></div>`;const dialog=document.querySelector('.modal');const focusables=()=>Array.from(dialog.querySelectorAll('button,input,textarea,select')).filter(e=>!e.disabled);focusables()[0]?.focus();dialog.onkeydown=e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=focusables(),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}
function openForm(){modal(`<h2 id="modal-title">记录拜访并安排下一步</h2><span class="tag">客户已带入：示例制造</span><p class="muted">设计示意：当前没有业务保存；可体验同一流程安排下次。</p><label for="summary">拜访结果</label><textarea id="summary">客户希望补充试运行方案，预算待确认。</textarea><label for="next">下一步</label><input id="next" value="安排方案评审"><label for="due">计划日期</label><input id="due" type="date" value="2026-11-16"><div class="modal-foot">${btn('取消',"closeModal()")}${btn('保存并安排下次 · 示意',"state.follow=true;closeModal();show('customer');note('设计示意保存，真实CRM未改变')",true)}</div>`)}
function openStage(){modal(`<h2 id="modal-title">核对阶段推进</h2><p>方案验证 → 报价（样例）</p><p>正式版服务端检查关键人、阶段要求和当前版本。</p><label><input id="stage-confirm" type="checkbox" style="width:auto"> 已核对方案评审结果及下一步</label><div class="modal-foot">${btn('取消',"closeModal()")}${btn('确认推进 · 示意',"if(!document.getElementById('stage-confirm').checked){note('请先完成核对');return}state.stage=3;closeModal();show('opportunity');note('仅推进本设计页状态')",true)}</div>`)}
show('home');
</script></body></html>
